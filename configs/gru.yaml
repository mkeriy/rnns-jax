# Train a GRU on your sequence data.
# Run: rnns-jax train --config configs/gru.yaml

experiment_name: ""          # prefix for the run folder name
model: GRU                   # GRU | LSTM | Mamba | blend
model_params:
  in_ftrs: 32                # number of feature columns
  hidden_ftrs: 256
  out_ftrs: 32               # number of target columns
  num_layers: 2
  bias: true

data:
  train_path: ./data/train.parquet    # one row per time step
  val_path: ./data/val.parquet        # remove to train without validation
  id_col: seq_id                      # one id per independent sequence; remove for a single series
  drop_cols: [seq_id, step]           # non-feature columns; everything else is a feature
  # feature_cols: [...]               # or list the input columns explicitly
  # target_cols: [...]                # defaults to the feature columns
  window: 100                         # time steps the model sees
  horizon: 1                          # predict 1 step after the window

optimizer: adam              # adam | adamw | sgd | rmsprop | adagrad | nadamw
optimizer_params: {}         # extra optimizer arguments, e.g. {weight_decay: 1.0e-4}
scheduler: linear            # linear | exponential; remove to use a constant lr
scheduler_params:
  init_value: 1.0e-3
  end_value: 3.0e-7
  transition_steps: 20000
  transition_begin: 10

seed: 75342
batch_size: 256
epochs: 8
eval_every: 2000             # validate every N steps; remove to validate each epoch
save_folder: ./experiments   # checkpoints go to <save_folder>/<run name>/
