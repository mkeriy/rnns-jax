[project]
name = "rnns-jax"
version = "0.1.0"
description = "RNNs and other sequence models in JAX + Flax NNX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mkeriy", email = "malkevich.dim@gmail.com" }]
keywords = ["jax", "flax", "rnn", "lstm", "gru", "mamba", "time-series", "sequence-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "flax>=0.12.8",
    "jax>=0.10.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.6",
]

[project.urls]
Homepage = "https://github.com/mkeriy/rnns-jax"
Repository = "https://github.com/mkeriy/rnns-jax"
Issues = "https://github.com/mkeriy/rnns-jax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnns_jax"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "ruff>=0.16.10",
]
